<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>TempConverter</title>
</head>
<body>
    <div class="main-comtainer">
        <p class="title">Temperature Conversion</p>

        <input type="number" class="tem-input-style js-tem-input" value="0">

        <section>
            <input type="checkbox" id="Celsius" class="units Celsius">
            <label for="Celsius">Celsius &#8658; Fahrenheit</label> 
            <br>
            <input type="checkbox" id="Fahrenheit" class="units Fahrenheit">
            <label for="Fahrenheit">Fahrenheit &#8658; Celsius</label>
        </section>

        <button type="submit" class="submit-btn-style js-submit-btn">submit</button>

        <p class="js-result result-style"></p>

    </div>

    <script src="./scripts.js"></script>
</body>
</html>
